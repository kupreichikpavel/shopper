name: User Service CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  user-service-ci:
    name: Build, Test, Sonar and Docker
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: user-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew clean assemble --no-daemon

      - name: Testing
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Code analysis with SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew sonar --no-daemon \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

      - name: Create Docker image
        run: docker build --tag "user-service:${GITHUB_SHA}" .

      - name: Save Docker image
        run: |
          docker save "user-service:${GITHUB_SHA}" \
            | gzip > user-service-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-service-image-${{ github.sha }}
          path: user-service/user-service-image.tar.gz
          retention-days: 7
