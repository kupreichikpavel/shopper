spring:
  application:
    name: user-service

  profiles:
    default: local

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8082/realms/shopper}
          audiences: user-service

  cache:
    type: redis
    cache-names:
      - user-details

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml