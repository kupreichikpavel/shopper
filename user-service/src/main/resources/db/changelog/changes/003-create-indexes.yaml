databaseChangeLog:
  - changeSet:
      id: 003-create-indexes
      author: pavel-kupreichik

      changes:
        - createIndex:
            indexName: idx_payment_cards_user_id
            tableName: payment_cards
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: idx_payment_cards_number
            tableName: payment_cards
            columns:
              - column:
                  name: number

      rollback:
        - dropIndex:
            indexName: idx_payment_cards_number
            tableName: payment_cards

        - dropIndex:
            indexName: idx_payment_cards_user_id
            tableName: payment_cards
