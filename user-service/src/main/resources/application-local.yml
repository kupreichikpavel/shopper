spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shopper}
    username: ${SPRING_DATASOURCE_USERNAME:shopper}
    password: ${SPRING_DATASOURCE_PASSWORD:shopper}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
