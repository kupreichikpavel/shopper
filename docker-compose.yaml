services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopper}
      POSTGRES_USER: ${POSTGRES_USER:-shopper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopper}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-shopper} -d ${POSTGRES_DB:-shopper}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/shopper}
      POSTGRES_DB: ${POSTGRES_DB:-shopper}
      POSTGRES_USER: ${POSTGRES_USER:-shopper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopper}
    ports:
      - "${USER_SERVICE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - shopper-network
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

networks:
  default:
  shopper-network:
    name: shopper-network
    external: true
